<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veranda \u2014 Traction One-Pager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --terracotta: #C25733;
    --terracotta-dark: #A3441F;
    --cream: #FAF7F2;
    --ink: #1A1A1A;
    --muted: #5C564F;
    --card: #FFFFFF;
    --line: #E8E0D5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 40px 32px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 3px solid var(--terracotta);
    margin-bottom: 28px;
  }

  .wordmark {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--terracotta);
    line-height: 1;
  }

  .tagline {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  .header-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.6;
    white-space: nowrap;
  }

  .header-meta strong { color: var(--ink); }

  /* ---------- Sections ---------- */
  section { margin-bottom: 24px; }

  .section-label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--terracotta);
    margin-bottom: 8px;
  }

  .section-body {
    font-size: 15px;
    color: var(--ink);
    max-width: 62ch;
  }

  .section-body a { color: var(--terracotta); font-weight: 600; text-decoration: none; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }

  /* ---------- Stat grid ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 4px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 16px 16px;
    box-shadow: 0 1px 3px rgba(26, 26, 26, 0.05);
  }

  .stat-number {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.1;
  }

  .stat-number .accent { color: var(--terracotta); }

  .stat-label {
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.35;
  }

  /* ---------- Callout ---------- */
  .callout {
    border: 2px solid var(--terracotta);
    border-radius: 12px;
    background: #FFF9F5;
    padding: 20px 24px;
    margin: 26px 0;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .callout-bar {
    flex: none;
    width: 4px;
    align-self: stretch;
    border-radius: 2px;
    background: var(--terracotta);
  }

  .callout p {
    font-size: 16.5px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink);
  }

  .callout p .accent { color: var(--terracotta-dark); }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }

  footer .contact a {
    color: var(--terracotta);
    font-weight: 600;
    text-decoration: none;
  }

  footer .contact span { margin: 0 8px; color: var(--line); }

  /* ---------- Print button ---------- */
  .print-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(194, 87, 51, 0.35);
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .print-btn:hover { background: var(--terracotta-dark); transform: translateY(-1px); }

  /* ---------- Small screens ---------- */
  @media (max-width: 640px) {
    .page { padding: 32px 20px; }
    header { flex-direction: column; align-items: flex-start; }
    .header-meta { text-align: left; }
    .two-col { grid-template-columns: 1fr; gap: 20px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    footer { flex-direction: column; gap: 6px; align-items: flex-start; }
  }

  /* ---------- Print ---------- */
  @page {
    margin: 1.5cm;
    size: A4 portrait;
  }

  @media print {
    body { background: #fff; }
    .page {
      max-width: none;
      padding: 0;
    }
    .print-btn { display: none; }
    header { margin-bottom: 20px; padding-bottom: 14px; }
    section { margin-bottom: 16px; }
    .wordmark { font-size: 34px; }
    .section-body { font-size: 13.5px; }
    .stat-grid { gap: 10px; }
    .stat-card {
      padding: 12px 12px 11px;
      box-shadow: none;
      break-inside: avoid;
    }
    .stat-number { font-size: 24px; }
    .stat-label { font-size: 11px; }
    .callout { margin: 18px 0; padding: 14px 18px; break-inside: avoid; }
    .callout p { font-size: 14px; }
    footer { margin-top: 20px; }
    a { text-decoration: none !important; }
  }
</style>

      <div class="tagline">Verify before you sign.</div>

    </section>
  </div>

    <div class="stat-grid">
      <div class="stat-card">

      </div>
      <div class="stat-card">
        <div class="stat-number">22</div>
        <div class="stat-label">emails captured</div>
      </div>

      <div class="stat-card">

        <div class="stat-number">0</div>
        <div class="stat-label">paid ads \u2014 100% word-of-mouth</div>
      </div>
    </div>
  </section>

  <div class="callout">
    <div class="callout-bar"></div>
    <p>48 self-selected visitors from one WhatsApp post. <span class="accent">46% email capture rate with zero ad spend \u2014 9&times; the industry average.</span></p>
  </div>

  <section>
    <div class="section-label">What's Next</div>
    <p class="section-body">First activation experiment in progress: testing an estate agent widget as a B2B acquisition layer to close the report-run gap.</p>
  </section>

  <footer>
    <div class="contact">
      <a href="https://yourveranda.com">yourveranda.com</a>
      <span>|</span>
      <a href="mailto:kevwe@yourveranda.com">kevwe@yourveranda.com</a>

  </footer>

        // Task #1179 (2026-05-13): surface ReferenceError /
        // "is not defined" / "Cannot read properties of undefined" runtime
        // failures in the published bundle back to the server. These are
        // the failure shapes produced when the build cache survives past
        // a source change (deleted file referenced from cached bundle,
        // identifier rename in cached bundle, etc). The server responds
        // by clearing the compile cache and republishing — a one-shot
        // self-heal that prevents the multi-hour outages of 2026-04-22.
        // Sent via sendBeacon (or fetch keepalive fallback) so the
        // request survives the page reload the user is about to trigger.
        // Task #2797: lightweight breadcrumb trail — the last few visitor
        // interactions (clicks + route changes) preceding a crash. Only
        // short labels / paths are kept, never input values or query strings.
        var __crumbs = [];
        function pushCrumb(c) {
          try {
            __crumbs.push(c);
            if (__crumbs.length > 5) __crumbs.shift();
          } catch (_e) {}
        }
        function pathOnly(u) {
          try { return String(u || '').split(/[?#]/)[0].slice(0, 200); } catch (_e) { return ''; }
        }
        pushCrumb({ route: pathOnly(location.pathname), at: Date.now() });
        document.addEventListener('click', function(ev) {
          try {
            var t = ev.target && ev.target.closest ? ev.target.closest('button, a, [role="button"]') : null;
            if (!t) return;
            var label = (t.getAttribute('aria-label') || t.textContent || t.tagName || '').trim().slice(0, 60);
            pushCrumb({ action: 'click: ' + label, at: Date.now() });
          } catch (_e) {}
        }, true);
        window.addEventListener('hashchange', function() {
          pushCrumb({ route: pathOnly(location.pathname) + (location.hash ? location.hash.slice(0, 60) : ''), at: Date.now() });
        });
        window.addEventListener('popstate', function() {
          pushCrumb({ route: pathOnly(location.pathname), at: Date.now() });
        });

        // Task #4977: the one-shot flag used to be page-wide, so an earlier
        // unhandled error silenced every later report — including the class
        // this beacon was blind to until now: a crash a React error boundary
        // caught (those never reach `window`, so they never got here at all).
        // The gate is now per source: at most one unhandled report, plus a
        // small capped number of boundary reports deduped by message, so a
        // crash loop still cannot flood the store.
        var __runtimeErrorReported = false;
        var __BOUNDARY_MAX_PER_PAGE = 3;
        var __boundaryReportCount = 0;
        var __boundarySeen = {};
        function reportRuntimeErrorToServer(msg, line, extra) {
          try {
            var opts = extra || {};
            var source = opts.source === 'boundary' ? 'boundary' : 'unhandled';
            if (source === 'boundary') {
              var dedupeKey = String(msg || '').slice(0, 200);
              if (!dedupeKey) return;
              // A report carrying the component stack or app name upgrades an
              // earlier one of the same crash that carried neither.
              var boundaryLevel = opts.componentStack || opts.appName ? 2 : 1;
              if ((__boundarySeen[dedupeKey] || 0) >= boundaryLevel) return;
              if (__boundaryReportCount >= __BOUNDARY_MAX_PER_PAGE) return;
            } else if (__runtimeErrorReported) {
              return;
            }
            var text = String(msg || '');
            if (source === 'boundary') {
              // Every crash a boundary catches is reported whatever its
              // wording. The server only records it and never republishes.
              __boundarySeen[text.slice(0, 200)] = boundaryLevel;
              __boundaryReportCount++;
            } else {
              // Filter aggressively — only report patterns that map to a
              // stale-cache class of failure. Other errors (network, image
              // 404s, application-level exceptions) are not actionable here.
              var stale =
                /ReferenceError/i.test(text) ||
                /is not defined/i.test(text) ||
                /is not a function/i.test(text) ||
                /Cannot read properties of undefined/i.test(text) ||
                /Cannot read property .* of undefined/i.test(text);
              if (!stale) return;
              __runtimeErrorReported = true;
            }
            var spaceId = "workspace-812590";
            if (!spaceId) return;
            var url = '/api/space/' + encodeURIComponent(spaceId) + '/runtime-error';
            var body = JSON.stringify({
              message: text.slice(0, 500),
              line: line || null,
              source: source,
              componentStack: opts.componentStack ? String(opts.componentStack).slice(0, 2000) : null,
              appName: opts.appName ? String(opts.appName).slice(0, 120) : null,
              userAgent: (navigator && navigator.userAgent) || null,
              href: (location && location.href) || null,
              pagePath: pathOnly(location && location.pathname),
              breadcrumbs: __crumbs.slice(-5),
              when: Date.now()
            });
            if (navigator && typeof navigator.sendBeacon === 'function') {
              try {
                var blob = new Blob([body], { type: 'application/json' });
                navigator.sendBeacon(url, blob);
                return;
              } catch (_beaconErr) {}
            }
            try {
              fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body,
                keepalive: true,
                credentials: 'omit'
              }).catch(function(){});
            } catch (_fetchErr) {}
          } catch (_outer) {}
        }
        window.addEventListener('error', function(ev) {
          var msg = ev && (ev.message || (ev.error && ev.error.message));
          if (msg) reportRuntimeErrorToServer(msg, ev && ev.lineno);
        });

        // Task #4977: the reporting seam for crashes an error boundary
        // catches. A boundary stops the throw before it reaches `window`, so
        // the listeners above are structurally blind to it — the app renders
        // its "failed to load" card and the platform never hears a thing.
        // Error boundaries (the shell template's, and the inline ones this
        // compiler emits) call this directly with the component stack and the
        // crashed app's name; the serve-time reporter injected into already
        // published pages routes through it too, so caps, dedupe and
        // breadcrumbs stay shared with the beacon.
        window.__audosReportBoundaryError__ = function(payload) {
          try {
            var p = payload || {};
            var message = p.message;
            if (message && typeof message === 'object') {
              message = message.message || String(message);
            }
            if (!message) return;
            reportRuntimeErrorToServer(message, null, {
              source: 'boundary',
              componentStack: p.componentStack || null,
              appName: p.appName || null
            });
          } catch (_e) {}
        };
        // Version 2 reports boundary crashes whatever their wording. The
        // serve-time reporter hands off only to version 2 or later, and takes
        // over the seam of an older page, whose reporter drops most of them.
        window.__audosReportBoundaryError__.version = 2;

        // Task #3522: CAPTURE-phase resource-error listener for dead images.
        //
        // Resource load failures do not bubble and carry no `message`, so the
        // bubble-phase listener directly above never sees them — and
        // reportRuntimeErrorToServer explicitly filters image 404s out anyway
        // because they are not the stale-cache class of failure it self-heals.
        // A dead <img src> therefore had no path to the server at all until a
        // founder reported it by hand.
        //
        // The browser is the right detector here: it is free, creates no
        // outbound fan-out from platform IPs, and catches hotlink protection,
        // geo blocks and user-agent filtering that a server-side HEAD would
        // either miss or misjudge. Deduped per URL and hard-capped per page
        // load so a page with many dead images cannot flood the store.
        var __deadAssetSeen = {};
        var __deadAssetReportCount = 0;
        var __DEAD_ASSET_MAX_PER_PAGE = 5;
        function reportDeadAssetToServer(assetUrl) {
          try {
            if (!assetUrl) return;
            var key = String(assetUrl).split('#')[0];
            if (!key) return;
            if (key.slice(0, 5) === 'data:' || key.slice(0, 5) === 'blob:') return;
            if (__deadAssetSeen[key]) return;
            if (__deadAssetReportCount >= __DEAD_ASSET_MAX_PER_PAGE) return;
            __deadAssetSeen[key] = true;
            __deadAssetReportCount++;
            var spaceId = "workspace-812590";
            if (!spaceId) return;
            var body = JSON.stringify({
              spaceId: spaceId,
              url: key.slice(0, 2000),
              pagePath: pathOnly(location && location.pathname),
              when: Date.now()
            });
            var endpoint = '/api/dead-asset-beacon';
            if (navigator && typeof navigator.sendBeacon === 'function') {
              try {
                navigator.sendBeacon(endpoint, new Blob([body], { type: 'application/json' }));
                return;
              } catch (_beaconErr) {}
            }
            fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body,
              keepalive: true,
              credentials: 'omit'
            }).catch(function() {});
          } catch (_e) {}
        }
        window.addEventListener('error', function(ev) {
          try {
            var target = ev && ev.target;
            if (!target || target === window) return;
            var tag = target.tagName ? String(target.tagName).toUpperCase() : '';
            if (tag !== 'IMG') return;
            reportDeadAssetToServer(target.currentSrc || target.src || '');
          } catch (_e) {}
        }, true);

        // Task #1435: shared recovery overlay. Accepts an optional
        // details string (the underlying error / fetch status / stack)
        // that the user can expand via "View details". The Try-again
        // button forces a cache-busting reload so a healed upstream
        // surfaces on next request.
        var __recoveryShown = false;
        function showRecovery(reason, details) {
          if (__recoveryShown) return;
          __recoveryShown = true;
          if (loader && !loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
            setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 300);
          }
          var el = document.createElement('div');
          el.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;font-family:system-ui,sans-serif;color:#0f172a;background:#fafafa;z-index:10000';
          var detailsHtml = '';
          if (details) {
            detailsHtml = '<details style="margin-top:1rem;max-width:520px;width:100%"><summary style="cursor:pointer;color:#64748b;font-size:0.8125rem">View details</summary><pre style="margin-top:0.5rem;padding:0.75rem;background:#f1f5f9;border-radius:0.5rem;font-size:0.75rem;line-height:1.4;color:#334155;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto">' + String(details).replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; }) + '</pre></details>';
          }
          el.innerHTML =
            '<div style="font-size:3rem;margin-bottom:1rem">⚠️</div>' +
            '<h2 style="margin-bottom:0.5rem;font-size:1.25rem">Something went wrong</h2>' +
            '<p style="color:#64748b;margin-bottom:1.25rem;text-align:center;max-width:420px">' + reason + '</p>' +
            '<div style="display:flex;gap:0.5rem">' +
              '<button id="__audos_retry_btn" style="padding:0.5rem 1.25rem;border-radius:0.5rem;border:1px solid #6366f1;background:#6366f1;color:#fff;cursor:pointer;font-size:0.875rem;font-weight:500">Try again</button>' +
              '<button id="__audos_reload_btn" style="padding:0.5rem 1.25rem;border-radius:0.5rem;border:1px solid #cbd5e1;background:#fff;color:#0f172a;cursor:pointer;font-size:0.875rem">Refresh page</button>' +
            '</div>' +
            detailsHtml;
          document.body.appendChild(el);
          var retry = document.getElementById('__audos_retry_btn');
          if (retry) retry.onclick = function() {
            var u = new URL(window.location.href);
            u.searchParams.set('_cb', String(Date.now()));
            if (!/[?&]cdn=fallback/.test(window.location.search)) {
              u.searchParams.set('cdn', 'fallback');
            }
            try { sessionStorage.removeItem('__audos_cold_retry'); } catch(e) {}
            try { sessionStorage.removeItem('__audos_cdn_fallback'); } catch(e) {}
            window.location.replace(u.toString());
          };
          var reload = document.getElementById('__audos_reload_btn');
          if (reload) reload.onclick = function() { window.location.reload(); };
        }

        function hideLoader() {
          if (!loader || loader.classList.contains('hidden')) return;
          loader.classList.add('hidden');
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 300);
          try { sessionStorage.removeItem('__audos_cold_retry'); } catch(e) {}
          try { sessionStorage.removeItem('__audos_cdn_fallback'); } catch(e) {}
        }

        // Keep the secondary user-facing loading copy visible while the
        // root still hasn't rendered. Triggers regardless of fatalError.
        setTimeout(function() {
          if (root.children.length === 0) {
            var sec = document.getElementById('space-loader-secondary');
            if (sec) sec.style.display = 'block';
          }
        }, 5000);

        // Use MutationObserver to detect when React renders content. The
        // module script above can render before this script attaches the
        // observer, so check the current DOM first to avoid a loader flash.
        var observer = new MutationObserver(function(mutations) {
          if (root.children.length > 0) {
            hideLoader();
            observer.disconnect();
          }
        });

        if (root.children.length > 0) {
          hideLoader();
          return;
        }
        
        observer.observe(root, { childList: true });
        // Task #4714: the give-up deadline is progress-aware. A slow mobile
        // connection is not a broken page: until document.readyState reaches
        // 'complete' the browser is still downloading and evaluating the
        // bundle, so the deadline is deferred instead of spent. ('complete',
        // not 'loading': browsers flip to 'interactive' as soon as the markup
        // is parsed, while the inline module and its ~100 esm.sh imports are
        // still in flight — that is precisely the healthy-but-slow case.)
        // Once loading genuinely finishes we still allow a grace window for
        // React's first paint (measured ~1s after load completes) before
        // declaring failure, and an absolute ceiling guarantees a page that
        // never finishes loading (e.g. an unreachable CDN that keeps the
        // module graph pending) still recovers on its own.
        window.__audos_shell_progress_aware__ = 1;
        var __shellDeadlineStart = Date.now();
        var __SHELL_BASE_DEADLINE_MS = 8000;
        var __SHELL_POST_LOAD_GRACE_MS = 5000;
        var __SHELL_ABSOLUTE_CEILING_MS = 60000;
        var __SHELL_LOADING_POLL_MS = 500;
        var __shellLoadingDoneAt = (document.readyState === 'complete') ? Date.now() : 0;
        document.addEventListener('readystatechange', function() {
          if (!__shellLoadingDoneAt && document.readyState === 'complete') {
            __shellLoadingDoneAt = Date.now();
          }
        });
        window.addEventListener('load', function() {
          if (!__shellLoadingDoneAt) __shellLoadingDoneAt = Date.now();
        });

        // Fallback: once the page has stopped making progress and still has no
        // visible content, show recovery.
        // Task #1435: surface the underlying cause via showRecovery(reason, details)
        // so the user sees the actual error, not just an opaque spinner.
        //
        // Auto-reload guard: _cb in the URL is the primary "already retried"
        // marker. sessionStorage alone fails open in mobile private mode and
        // in-app webviews (including ChatGPT's), which previously caused an
        // infinite _cb= reload loop and 100% mobile bounce on slow pages.
        function __shellGiveUp() {
          var isTopLevel = (window === window.parent);
          // Product Run / tenant delegation iframe. Apps often mount with
          // position:fixed (out of #root's document flow), so #root.offsetHeight
          // stays ~0 even when the calendar is fully visible. Never auto-reload
          // or empty-overlay that surface — that is the Bipp "refresh" bug.
          var isDelegatedProductRun = !!(window.__TENANT_DELEGATION__ || window.__TENANT_DELEGATION_CANVAS__);
          var usingCdnFallback = /[?&]cdn=fallback/.test(window.location.search);
          var hasCacheBuster = /[?&]_cb=/.test(window.location.search);
          var alreadyTriedCdn = false;
          try { alreadyTriedCdn = !!sessionStorage.getItem('__audos_cdn_fallback'); } catch(e) {}

          // CDN fallback helper: redirect with ?cdn=fallback so the server
          // rewrites the import map from esm.sh to cdn.jsdelivr.net.
          // Top-level pages only — never Product Run iframes (location.replace
          // remounts the whole calendar) and never generic preview iframes.
          // URL cdn=fallback is the durable guard; sessionStorage is secondary.
          function tryCdnFallback() {
            if (!isTopLevel || isDelegatedProductRun || usingCdnFallback || alreadyTriedCdn) return false;
            try { sessionStorage.setItem('__audos_cdn_fallback', String(Date.now())); } catch(e) {}
            var u = new URL(window.location.href);
            u.searchParams.set('cdn', 'fallback');
            u.searchParams.set('_cb', String(Date.now()));
            window.location.replace(u.toString());
            return true;
          }

          if (fatalError) {
            // fatalError may still take one CDN hop even if _cb is present.
            if (tryCdnFallback()) return;
            showRecovery('A script error prevented the page from loading.', fatalError);
            return;
          }
          if (root.children.length === 0) {
            // Primary guard: _cb already in the URL means we already auto-reloaded.
            // Secondary: sessionStorage when available. Manual Retry button clears both.
            var alreadyRetried = hasCacheBuster;
            if (!alreadyRetried) {
              try { alreadyRetried = !!sessionStorage.getItem('__audos_cold_retry'); } catch(e) {}
            }

            if (isTopLevel && !alreadyRetried) {
              // Step 1: cold-start retry (warm the compile cache) — at most once.
              try { sessionStorage.setItem('__audos_cold_retry', String(Date.now())); } catch(e) {}
              var u = new URL(window.location.href);
              u.searchParams.set('_cb', String(Date.now()));
              window.location.replace(u.toString());
              return;
            }
            // Step 2: CDN fallback — esm.sh may be unreachable. Do not burn a
            // second reload after the _cb cold-retry hop.
            if (!hasCacheBuster && tryCdnFallback()) return;
            showRecovery('The page failed to load. This may be a network or regional issue.', 'No content rendered in the root element after the document stopped loading. The application bundle may have failed to evaluate.');
            return;
          }
          // Product Run: React mounted (children present). Fixed-position app
          // canvases leave #root at 0 height — that is success, not emptiness.
          if (isDelegatedProductRun) {
            hideLoader();
            return;
          }
          // Check if rendered content has any visible height
          var hasVisibleContent = root.offsetHeight > 50 || root.scrollHeight > 50;
          if (!hasVisibleContent) {
            showRecovery('The page loaded but appears empty.', 'The root element has children but no visible height. The component tree may have rendered null.');
            return;
          }
          // Hide loader if still showing
          hideLoader();
        }

        function __scheduleShellGiveUp(delay) {
          setTimeout(function() {
            var now = Date.now();
            // A hard script error is not "still loading" — recover right away.
            if (fatalError) { __shellGiveUp(); return; }
            // Absolute ceiling: never spin forever.
            if (now - __shellDeadlineStart >= __SHELL_ABSOLUTE_CEILING_MS) { __shellGiveUp(); return; }
            // Something rendered — the remaining checks (visible height,
            // Product Run) must still run on the normal schedule.
            if (root.children.length > 0) { __shellGiveUp(); return; }
            // Still downloading/evaluating: progress is being made, wait.
            if (document.readyState !== 'complete') {
              __scheduleShellGiveUp(__SHELL_LOADING_POLL_MS);
              return;
            }
            if (!__shellLoadingDoneAt) __shellLoadingDoneAt = now;
            var sinceLoaded = now - __shellLoadingDoneAt;
            if (sinceLoaded < __SHELL_POST_LOAD_GRACE_MS) {
              __scheduleShellGiveUp(__SHELL_POST_LOAD_GRACE_MS - sinceLoaded);
              return;
            }
            __shellGiveUp();
          }, delay);
        }
        __scheduleShellGiveUp(__SHELL_BASE_DEADLINE_MS);
      })();
    </script>
  </body>
